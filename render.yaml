services:
  - type: web
    name: frcenter-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: FrCenter
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: frcenter-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: frcenter-redis
          property: connectionString
      - key: MEDIA_STORAGE_PATH
        value: ./app/storage
      - key: MESSAGE_TTL_SECONDS
        value: "7200"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_SSL
        value: "true"
      - key: FRONTEND_URL
        value: https://frcenter-frontend.onrender.com
      - key: FRONTEND_ORIGIN_REGEX
        value: ^https://.*onrender.com$
      - key: BACKEND_URL
        value: https://frcenter-backend.onrender.com

  - type: web
    name: frcenter-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_BACKEND_URL
        value: https://frcenter-backend.onrender.com

  - type: keyvalue
    name: frcenter-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: frcenter-db
    plan: free
    databaseName: frcenter
    user: frcenter
